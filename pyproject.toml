[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isi-platform"
version = "0.1.0"
description = "Institut za socijalnu inkluziju platform foundation"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "jinja2>=3.1,<4",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "redis>=5,<7",
  "rq>=2,<3",
  "streamlit>=1.41,<2",
  "httpx>=0.27,<1",
  "argon2-cffi>=23.1,<26",
  "email-validator>=2.2,<3",
  "beautifulsoup4>=4.12,<5",
  "bleach>=6.1,<7"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
