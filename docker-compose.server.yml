name: ${COMPOSE_PROJECT_NAME:-isi}

x-app-build: &app-build
  context: .
  dockerfile: docker/Dockerfile

x-app-common: &app-common
  env_file:
    - ${ISI_SERVER_ENV_FILE:-/home/ubuntu/ISI/runtime/.env.server}
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped
    mem_limit: 1g

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped
    mem_limit: 256m

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${DATA_S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${DATA_S3_SECRET_ACCESS_KEY}
    volumes:
      - minio_data:/data
    restart: unless-stopped
    mem_limit: 1g

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${DATA_S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${DATA_S3_SECRET_ACCESS_KEY}
      DATA_S3_BUCKET: ${DATA_S3_BUCKET}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until mc alias set isi http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null 2>&1; do sleep 1; done
        mc mb --ignore-existing "isi/$${DATA_S3_BUCKET}"
        mc anonymous set none "isi/$${DATA_S3_BUCKET}" >/dev/null
        echo "ISI object-storage bucket ready"
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.31.0
    profiles: ["precutover"]
    environment:
      MP_MAX_MESSAGES: "1000"
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ALLOW_INSECURE: "0"
      MP_ALLOW_INTERNAL_HTTP_REQUESTS: "false"
    volumes:
      - mailpit_data:/data
    restart: unless-stopped
    mem_limit: 256m

  migrate:
    image: ${ISI_APP_IMAGE:-isi-app:server}
    build: *app-build
    <<: *app-common
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    image: ${ISI_APP_IMAGE:-isi-app:server}
    build: *app-build
    <<: *app-common
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "uvicorn", "src.api.app:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()"]
      interval: 5s
      timeout: 4s
      retries: 40
    restart: unless-stopped
    mem_limit: 1g
    networks:
      default: {}
      ingress:
        aliases: ["isi-api"]

  streamlit:
    image: ${ISI_APP_IMAGE:-isi-app:server}
    build: *app-build
    <<: *app-common
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-m", "streamlit", "run", "src/streamlit_app/app.py", "--server.address", "0.0.0.0", "--server.port", "8501", "--server.headless", "true", "--server.baseUrlPath", "app"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/app/_stcore/health', timeout=3).read()"]
      interval: 5s
      timeout: 4s
      retries: 40
    restart: unless-stopped
    mem_limit: 1g
    networks:
      default: {}
      ingress:
        aliases: ["isi-streamlit"]

  data-worker:
    image: ${ISI_APP_IMAGE:-isi-app:server}
    build: *app-build
    <<: *app-common
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "src.workers.data_worker"]
    restart: unless-stopped
    mem_limit: 1g

  ai-worker:
    image: ${ISI_APP_IMAGE:-isi-app:server}
    build: *app-build
    <<: *app-common
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "src.workers.ai_worker"]
    restart: unless-stopped
    mem_limit: 2g

  edge:
    image: nginx:1.29.8-alpine
    profiles: ["precutover"]
    depends_on:
      api:
        condition: service_healthy
      streamlit:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ISI_PRECUTOVER_HTTPS_PORT:-8445}:443"
    volumes:
      - ./docker/nginx/isi-server-precutover.conf:/etc/nginx/conf.d/default.conf:ro
      - /home/ubuntu/ISI/runtime/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1/api/v1/health >/dev/null"]
      interval: 5s
      timeout: 4s
      retries: 40
    restart: unless-stopped
    mem_limit: 128m

volumes:
  postgres_data:
    name: ${ISI_POSTGRES_VOLUME:-isi_postgres_data}
  redis_data:
    name: ${ISI_REDIS_VOLUME:-isi_redis_data}
  minio_data:
    name: ${ISI_MINIO_VOLUME:-isi_minio_data}
  mailpit_data:
    name: ${ISI_MAILPIT_VOLUME:-isi_mailpit_data}

networks:
  default:
    name: ${ISI_INTERNAL_NETWORK:-isi_internal}
  ingress:
    external: true
    name: ${ISI_INGRESS_NETWORK:-isi_ingress}
