name: ${COMPOSE_PROJECT_NAME:-isi15staging}

x-app-env: &app-env
  env_file:
    - ${ISI15_ENV_FILE:-/tmp/isi15-staging/.env.staging.runtime}

x-app-build: &app-build
  context: .
  dockerfile: docker/Dockerfile

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${DATA_S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${DATA_S3_SECRET_ACCESS_KEY}
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${DATA_S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${DATA_S3_SECRET_ACCESS_KEY}
      DATA_S3_BUCKET: ${DATA_S3_BUCKET}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until mc alias set isi15 http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null 2>&1; do sleep 1; done
        mc mb --ignore-existing "isi15/$${DATA_S3_BUCKET}"
        mc anonymous set none "isi15/$${DATA_S3_BUCKET}" >/dev/null
        echo "MinIO staging bucket ready"
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.31.0
    environment:
      MP_MAX_MESSAGES: "500"
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ALLOW_INSECURE: "0"
      MP_ALLOW_INTERNAL_HTTP_REQUESTS: "false"
    volumes:
      - mailpit_data:/data
    ports:
      - "127.0.0.1:${ISI15_MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

  migrate:
    image: ${ISI15_APP_IMAGE:-isi15-staging-app:local}
    build: *app-build
    <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    image: ${ISI15_APP_IMAGE:-isi15-staging-app:local}
    build: *app-build
    <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "uvicorn", "src.api.app:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()"]
      interval: 5s
      timeout: 4s
      retries: 30
    restart: unless-stopped

  streamlit:
    image: ${ISI15_APP_IMAGE:-isi15-staging-app:local}
    build: *app-build
    <<: *app-env
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-m", "streamlit", "run", "src/streamlit_app/app.py", "--server.address", "0.0.0.0", "--server.port", "8501", "--server.headless", "true", "--server.baseUrlPath", "app"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/app/_stcore/health', timeout=3).read()"]
      interval: 5s
      timeout: 4s
      retries: 30
    restart: unless-stopped

  data-worker:
    image: ${ISI15_APP_IMAGE:-isi15-staging-app:local}
    build: *app-build
    <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "src.workers.data_worker"]
    restart: unless-stopped

  ai-worker:
    image: ${ISI15_APP_IMAGE:-isi15-staging-app:local}
    build: *app-build
    <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "src.workers.ai_worker"]
    restart: unless-stopped

  nginx:
    image: nginx:1.29.8-alpine
    depends_on:
      api:
        condition: service_healthy
      streamlit:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ISI15_HTTPS_PORT:-8443}:443"
    volumes:
      - ./docker/nginx/isi15-staging.conf:/etc/nginx/conf.d/default.conf:ro
      - ${ISI15_RUNTIME_DIR:-/tmp/isi15-staging}/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1/robots.txt >/dev/null"]
      interval: 5s
      timeout: 4s
      retries: 30
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  mailpit_data:
