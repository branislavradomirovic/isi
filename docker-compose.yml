services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-isi}
      POSTGRES_USER: ${POSTGRES_USER:-isi_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - isi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-isi_app} -d ${POSTGRES_DB:-isi}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - isi_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: python -m uvicorn src.api.app:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-isi_app}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-isi}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: python -m streamlit run src/streamlit_app/app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: python -m src.workers.worker
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-isi_app}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-isi}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  isi_postgres_data:
  isi_redis_data:
